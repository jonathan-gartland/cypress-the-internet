# Issue/PR agent: mention @claude in an issue, issue comment or PR review (as the repo owner)
# and it works on a claude/* branch. Changes reach main only through a PR that passes CI.
name: Claude

on:
  issues:
    types: [opened, assigned]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

env:
  # Keep in sync with e2e.yml and docker-compose.yml
  THE_INTERNET_REF: dd692f41b39503a8355693d6ce1c49a67955f19b

jobs:
  claude:
    # Public repo: only the owner can start a run, so others can't spend the token.
    if: >-
      (github.event_name == 'issues' &&
       github.event.issue.author_association == 'OWNER' &&
       (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude'))) ||
      (github.event_name == 'issue_comment' &&
       github.event.comment.author_association == 'OWNER' &&
       contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' &&
       github.event.comment.author_association == 'OWNER' &&
       contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' &&
       github.event.review.author_association == 'OWNER' &&
       contains(github.event.review.body, '@claude'))
    timeout-minutes: 60
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # So the agent can run the specs it writes
      - uses: ./.github/actions/start-the-internet
        with:
          ref: ${{ env.THE_INTERNET_REF }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install Cypress binary
        run: pnpm exec cypress install

      - name: Run Claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 60
            --allowedTools "Bash(pnpm type-check),Bash(pnpm lint),Bash(pnpm lint:fix),Bash(pnpm cy:run:*),Bash(pnpm install --ignore-scripts:*),Bash(pnpm exec commitlint:*)"
            --disallowedTools "Edit(.github/**),Write(.github/**)"
